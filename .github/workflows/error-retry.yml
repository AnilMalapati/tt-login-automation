name: Tradetron Error-Execution Auto-Retry

on:
  # Triggered externally by cron-job.org every 1 min during IST market hours.
  # GitHub's hosted cron is intentionally NOT used here — it's unreliable on
  # the free tier (15-60 min delays during peak load), and we'd just get
  # duplicate runs alongside cron-job.org. See README "Schedule via
  # cron-job.org" for the exact dispatch recipe.
  workflow_dispatch:

jobs:
  retry-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome + ChromeDriver
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run error retry script
        env:
          TRADETRON_EMAIL: ${{ secrets.TRADETRON_EMAIL }}
          TRADETRON_PASSWORD: ${{ secrets.TRADETRON_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tradetron_error_retry.py --force
