name: Tradetron Error-Execution Auto-Retry

on:
  schedule:
    # Every 1 min, 3:30 AM – 10:00 AM UTC (9:00 AM – 3:30 PM IST), weekdays.
    # GitHub Actions minutes are unlimited on public repos, so this is free.
    #
    # NOTE: GitHub's hosted scheduler often delays cron jobs by 15-60 min
    # during peak load. For reliable per-minute cadence, configure cron-job.org
    # to POST to this workflow's dispatches endpoint (see README).
    - cron: '* 4-9 * * 1-5'
    - cron: '30-59 3 * * 1-5'
  workflow_dispatch: # manual trigger

jobs:
  retry-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome + ChromeDriver
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run error retry script
        env:
          TRADETRON_EMAIL: ${{ secrets.TRADETRON_EMAIL }}
          TRADETRON_PASSWORD: ${{ secrets.TRADETRON_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tradetron_error_retry.py --force
