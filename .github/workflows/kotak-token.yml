name: Kotak Neo V3 Token Regeneration

on:
  # Triggered externally by cron-job.org at 8:45 AM IST on weekdays.
  # GitHub's hosted cron is intentionally NOT used here — it's unreliable on
  # the free tier (15-60 min delays during peak load), and keeping it
  # alongside cron-job.org just causes duplicate runs. See README Step 5 for
  # the exact dispatch recipe.
  workflow_dispatch:

jobs:
  regenerate-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome + ChromeDriver
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Regenerate Kotak Neo V3 token
        env:
          TRADETRON_EMAIL: ${{ secrets.TRADETRON_EMAIL }}
          TRADETRON_PASSWORD: ${{ secrets.TRADETRON_PASSWORD }}
          REGEN_TOKEN_URL: ${{ secrets.REGEN_TOKEN_URL }}
        run: python kotakneo_autologin.py --force
